<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>综合案例4</title>
    <style>
        div.banner {
            height: 500px;
            background-color: #f3f3f4;
            background-image: url("../images/aa31639e9f2ffdc35ab4f75ee4c920c5.jpg");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: left bottom;
            
            text-align: right;
            color: white;
        }
        
        .banner p {
            font-size: 20px;
        }
        
        .banner h2 {
            font-size: 36px;
            font-weight: normal;
            line-height: 100px;
        }
        
        .banner a {
            display: inline-block;
            text-decoration: none;
            background-color: orange;
            color: white;
            width: 125px;
            height: 40px;
            line-height: 40px;
            text-align: center;
            font-size: 20px;
        }
        
        .banner a:hover {
            background-color: rgba(255, 165, 0, 0.19);
        }
    
    </style>
</head>
<body>
<div class="banner">
    <h2>让创造产生价值</h2>
    <p>我们希望小游戏平台提供无线的可能性，让每一个创意都能传递给用户。</p>
    <a href="#">我要报名</a>
</div>
</body>
</html>

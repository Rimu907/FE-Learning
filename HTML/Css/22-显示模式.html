<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>显示模式</title>
    <style>
        div {
            width: 100px;
            height: 100px;
            
            /*display: inline-block;*/
            /*display: inline;*/
        }
        
        .div1 {
            background-color: red;
        }
        
        .div2 {
            background-color: orange;
        }
        
        span {
            width: 100px;
            height: 100px;
            display: block;
        }
        
        .span1 {
            background-color: green;
        }
        
        .span2 {
            background-color: blue;
        }
        
        img {
            width: 100px;
            display: block;
        }
    </style>
</head>
<body>
<!--块元素-->
<div class="div1">div标签1</div>
<div class="div2">div标签2</div>
<!--行内元素-->
<span class="span1">span0111111</span>
<span class="span2">span02</span>
<!--行内块元素-->
<img alt="" src="../images/Snipaste_2024-12-23_20-29-57.jpg">
<img alt="" src="../images/Snipaste_2024-12-23_20-29-57.jpg">
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>伪元素</title>
    <style>
        div {
            width: 300px;
            height: 300px;
            background-color: pink;
        }
        
        div::before {
            width: 100px;
            height: 100px;
            display: block;
            content: '老鼠';
            background-color: brown;
        }
        
        div::after {
            width: 100px;
            height: 100px;
            display: block;
            content: '大米';
            display: inline-block;
            background-color: yellow;
        }
    </style>
</head>
<body>

<div>
    爱
</div>
</body>
</html>

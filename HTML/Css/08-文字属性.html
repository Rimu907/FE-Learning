<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>文字属性</title>
    <style>
        p {
            font-size: 20px;
            font-weight: bold;
            font-style: italic;
            line-height: 30px;
        }
        
        .tt {
            line-height: 2;
            font-weight: bold;
            font-size: 20px;
        }
    </style>
</head>
<body>
<p>测试文字</p>
<div>默认大小</div>
<br>
<div class="tt">
    在清晨的第一缕阳光洒进窗户时，空气中弥漫着淡淡的花香，温柔地唤醒了沉睡的城市。你坐在窗边，手中捧着一杯温热的咖啡，远处的云朵缓缓飘动，像是大自然在诉说一个温柔的故事。今天，又是一个充满无限可能的一天，无论前方等待的是挑战还是惊喜，你都将带着微笑和坚定的步伐，迈向属于自己的旅程。
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>综合案例3</title>
    <style>
        div {
            background-color: cornflowerblue;
            width: 200px;
            text-align: center;
        }
        
        a {
            display: block;
            text-decoration: none;
            color: white;
            line-height: 80px;
            font-family: Microsoft YaHei, serif;
            width: 200px;
            height: 80px;
        }
        
        a:hover {
            color: aquamarine;
            background-color: rgba(175, 197, 241, 0.47);
        }
    </style>
</head>
<body>
<div>
    <a href="#">HTML</a>
    <a href="#">CSS</a>
    <a href="#">JavaScript</a>
    <a href="#">Vue</a>
    <a href="#">React</a>
</div>
</body>
</html>

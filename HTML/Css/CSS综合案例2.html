<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CSS综合案例2</title>
    <style>
        h1 {
            color: #333;
        }
        
        p {
            text-indent: 2em;
            font-size: 14px;
            color: #444;
            line-height: 30px;
        }
        
        a {
            color: #0069c4;
        }
        
        li {
            font-size: 14px;
            color: #444;
            line-height: 30px;
        }
    </style>
</head>
<body>
<h1>Xmas (圣诞快乐)</h1>
<p>在清晨的第一缕阳光洒进窗户时，空气中弥漫着淡淡的 <a href="#">花香</a>，温柔地唤醒了沉睡的城市。</p>
<p><b>你坐在窗边，手中捧着一杯温热的咖啡，</b>远处的云朵缓缓飘动，像是大自然在诉说一个温柔的故事。</p>
<ul>
    <li>今天，又是一个充满无限可能的一天</li>
    <li>无论前方等待的是挑战还是惊喜</li>
    <li>你都将带着 <a href="#">微笑</a> 和坚定的步伐，迈向属于自己的旅程。</li>
</ul>
</body>
</html>

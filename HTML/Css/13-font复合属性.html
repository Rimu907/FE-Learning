<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>font复合属性</title>
    <style>
        div {
            background-color: gainsboro;
            width: 400px;
            font: bold 20px microsoft yahei;
            /*text-indent: 2em;*/
            text-align: center;
        }
        
        img {
            width: 200px;
        }
        
        p {
            font: normal 15px microsoft yahei;
            text-decoration: line-through;
            color: rgba(2, 200, 100, 0.5);
        }
        
        a {
            font: normal 15px microsoft yahei;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div>
    蜡笔小新
    <br>
    <img alt="" src="../images/Snipaste_2024-12-23_20-15-09.jpg">
    <br>
    <p>吃包子</p>
    <a href="#">不吃</a>
</div>
</body>
</html>

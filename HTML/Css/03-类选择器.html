<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
          name="viewport">
    <meta content="ie=edge" http-equiv="X-UA-Compatible">
    <title>选择器</title>
    <style>
        p {
            color: #d81111;
            font-size: 20px;
        }
        
        .red {
            color: red;
        }
        
        .green {
            color: #99b6d3;
        }
        
        .size {
            font-size: 20px;
        }
    </style>
</head>
<body>
<div>
    <p>这是p标签</p>
    <p>1111</p>
    <p>2222</p>
    <h3 class="red">33333</h3>
    <h3 class="red">44444</h3>
    <div class="size green">
        <h4>555</h4>
        <h4>555</h4>
    </div>
</div>
</body>
</html>

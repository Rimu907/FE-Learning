<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>阴影</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        .father {
            width: 300px;
            height: 300px;
            background-color: pink;
            padding: 10px;
            border-radius: 10px;
            margin: 0 auto;
        }
        
        .son {
            overflow: hidden;
            margin: 10px auto;
            width: 100px;
            height: 100px;
            border: 3px solid darkorange;
            border-radius: 50%;
            background-color: orange;
            box-shadow: 2px 5px 5px rgba(0, 0, 0, 0.5);
        }
        
        .son:hover {
            box-shadow: 2px 10px 10px rgba(0, 0, 0, 0) inset;
        }
        
        .son img {
            width: 100px;
        }
    </style>
</head>
<body>
<div class="father">
    <div class="son">
        <img alt="" src="../images/Snipaste_2024-12-23_20-15-09.jpg">
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>圆角</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        .father {
            width: 300px;
            height: 300px;
            background-color: pink;
            padding: 10px;
            border-radius: 10px;
            margin: 0 auto;
        }
        
        .son {
            overflow: hidden;
            margin: 10px auto;
            width: 100px;
            height: 100px;
            border: 3px solid darkorange;
            border-radius: 50%;
            background-color: orange;
        }
        
        .son2 {
            border: 1px solid darkorange;
            background-color: red;
            width: 200px;
            height: 100px;
            border-radius: 40px;
            margin: 10px auto;
        }
        
        .son img {
            width: 100px;
        }
    </style>
</head>
<body>
<div class="father">
    <div class="son">
        <img alt="" src="../images/Snipaste_2024-12-23_20-15-09.jpg">
    </div>
    <div class="son2">
    
    </div>
</div>
</body>
</html>

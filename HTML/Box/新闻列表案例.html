<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>新闻列表案例</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        li {
            list-style: none;
        }
        
        a {
            text-decoration: none;
        }
        
        .news {
            margin: 100px auto;
            width: 360px;
            height: 200px;
            background-color: #e6e6e6;
        }
        
        .news .hd {
            height: 34px;
            background-color: #eee;
            border: 1px solid #dbdee1;
            border-left: none;
            display: flex;
        }
        
        .news .hd a {
            margin-top: -1px;
            border-top: 3px solid #ff8400;
            border-right: 1px solid #dbdee1;
            display: block;
            height: 34px;
            width: 48px;
            background-color: #fff;
            
            text-align: center;
            line-height: 32px;
            font-size: 14px;
            color: #333;
        }
        
        .bd {
            padding: 5px;
        }
        
        .news .bd li {
            padding-left: 15px;
            background-image: url(../images/Snipaste_2025-01-02_14-59-31.jpg);
            background-repeat: no-repeat;
            background-size: 6px;
            background-position: 0, center;
        }
        
        .news .bd li a {
            padding-left: 25px;
            background-image: url("../images/Snipaste_2025-01-02_15-08-16.jpg");
            background-repeat: no-repeat;
            background-size: 20px;
            background-position: 0 center;
            
            font-size: 12px;
            color: #666;
            line-height: 24px;
        }
        
        .news .bd li a:hover {
            color: orangered;
        }
    </style>
</head>
<body>
<div class="news">
    <div class="hd">
        <a href="#">新闻</a>
        <a href="#">娱乐</a>
    </div>
    <div class="bd">
        <ul>
            <li><a href="#">一款广泛使用的设计协作工具</a></li>
            <li><a href="#">支持多种设计格式的标注工具</a></li>
            <li><a href="#">一体化的产品设计协作平台</a></li>
            <li><a href="#">基于云的设计工具</a></li>
        </ul>
    </div>

</div>
</body>
</html>

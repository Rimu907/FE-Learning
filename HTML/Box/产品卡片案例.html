<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>产品卡片</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #e3e3e3;
        }
        
        .product {
            margin: 50px auto;
            padding-top: 40px;
            
            width: 270px;
            height: 253px;
            background-color: #fff;
            text-align: center;
            
            border-radius: 10px;
        }
        
        .product img {
            width: 30%;
            border-radius: 50%;
        }
        
        .product h4 {
            margin-top: 20px;
            margin-bottom: 12px;
            font-size: 18px;
            font-weight: normal;
            color: #333;
        }
        
        .product p {
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="product">
    <img alt="" src="../images/Snipaste_2024-12-23_20-29-57.jpg">
    <h4>抖音直播大象</h4>
    <p>包含动物派对多人对战</p>
</div>
</body>
</html>

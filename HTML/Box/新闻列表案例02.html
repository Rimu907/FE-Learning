<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>案例复现</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        ul {
            list-style: none;
        }
        
        a {
            text-decoration: none;
        }
        
        .news {
            margin: 50px auto;
            width: 400px;
            height: 300px;
        }
        
        .lb {
            height: 34px;
            background-color: #eee;
            border: 1px solid #dbdee1;
            border-left: none;
        }
        
        .lb a {
            border-top: 3px solid red;
            border-right: 1px solid #dbdee1;
            margin-top: -1px;
            display: block;
            background-color: #fff;
            width: 48px;
            height: 34px;;
            
            font-size: 14px;
            line-height: 34px;
            text-align: center;
            color: #333;
        }
        
        .bd {
            padding: 5px;
            background-color: #e1e1e1;
        }
        
        li {
            padding-left: 15px;
            
            background-image: url("../images/Snipaste_2025-01-02_14-59-31.jpg");
            background-repeat: no-repeat;
            background-size: 8px;
            background-position: 0, center;
        }
        
        .bd a {
            background-image: url("../images/Snipaste_2025-01-02_15-08-16.jpg");
            background-repeat: no-repeat;
            background-size: 20px;
            background-position: 0, center;
            
            line-height: 32px;
            padding-left: 25px;
            font-size: 12px;
            color: #535353;
        }
        
        .bd a:hover {
            color: orange;
        }
    </style>
</head>
<body>
<div class="news">
    <div class="lb">
        <a href="#">新闻</a>
    </div>
    <div class="bd">
        <ul>
            <li><a href="#">一款广泛使用的设计协作工具</a></li>
            <li><a href="#">支持多种设计格式的标注工具</a></li>
            <li><a href="#">一体化的产品设计协作平台</a></li>
            <li><a href="#">基于云的设计工具</a></li>
        </ul>
    </div>
</div>
</body>
</html>
